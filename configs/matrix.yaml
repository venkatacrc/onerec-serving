# Benchmark run matrix for OneRec-8B-Pro on 8x B200.
#
# Each entry becomes one full lifecycle: start server -> smoke test ->
# latency sweep -> throughput sweep -> stop server -> next entry.
# Runs execute SEQUENTIALLY (one engine/config at a time) so GPUs are never
# shared between two configurations being measured -- this is deliberate,
# it's the only way to get clean, comparable numbers.
#
# Feel free to comment out entries for a faster first pass, or add more
# (e.g. TP=2/TP=4 for sglang/trtllm, additional fp8 configs) once the
# pipeline is proven end to end. Estimated wall time for the full matrix
# below: ~2-4 hours depending on network speed (image/model pulls) and
# disk speed.
#
# `gpus` must list exactly `tp` device ids.

defaults:
  max_model_len: 8192
  latency:
    input_lens: "128,512,2048"     # short chat-like / typical rec-context / long history
    output_lens: "128,256"
    repetitions: 20
    warmup_requests: 3
  throughput:
    concurrency_levels: "1,2,4,8,16,32,64,128,256"
    fixed_input_len: 512
    fixed_output_len: 256
    warmup_seconds: 10
    measure_seconds: 45

runs:
  # --- vLLM: tensor-parallel scaling study on a dense 8B model -------------
  # (small dense models rarely benefit from TP>2 on a single NVLink-connected
  # node -- this quantifies exactly how much, or how little, for OneRec-8B-Pro)
  - name: vllm-tp1-bf16
    engine: vllm
    tp: 1
    gpus: "0"
    dtype: bfloat16

  - name: vllm-tp2-bf16
    engine: vllm
    tp: 2
    gpus: "0,1"
    dtype: bfloat16

  - name: vllm-tp4-bf16
    engine: vllm
    tp: 4
    gpus: "0,1,2,3"
    dtype: bfloat16

  - name: vllm-tp8-bf16
    engine: vllm
    tp: 8
    gpus: "0,1,2,3,4,5,6,7"
    dtype: bfloat16

  # --- vLLM: FP8 quantization impact on Blackwell --------------------------
  - name: vllm-tp1-fp8
    engine: vllm
    tp: 1
    gpus: "0"
    dtype: fp8

  # --- SGLang: engine-vs-engine comparison at matched TP -------------------
  - name: sglang-tp1-bf16
    engine: sglang
    tp: 1
    gpus: "0"
    dtype: bfloat16

  - name: sglang-tp8-bf16
    engine: sglang
    tp: 8
    gpus: "0,1,2,3,4,5,6,7"
    dtype: bfloat16

  # --- TensorRT-LLM: engine-vs-engine comparison at matched TP -------------
  - name: trtllm-tp1-bf16
    engine: trtllm
    tp: 1
    gpus: "0"
    dtype: bfloat16
