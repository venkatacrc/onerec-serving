# Reference feature-store service (platform/feature_store/) + a Redis
# backing store so it's a real shared-state service across replicas, not
# a per-pod in-memory mock. See docs/PRODUCTION_ARCHITECTURE.md §3
# "Feature store" row for what to change to point this at a real system.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerec-redis
  namespace: onerec
  labels: {app: onerec-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: onerec-redis}}
  template:
    metadata: {labels: {app: onerec-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: "250m", memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 5}
          livenessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: onerec-redis, namespace: onerec}
spec:
  selector: {app: onerec-redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onerec-feature-store
  namespace: onerec
  labels: {app: onerec-feature-store}
spec:
  replicas: 2
  selector: {matchLabels: {app: onerec-feature-store}}
  template:
    metadata: {labels: {app: onerec-feature-store}}
    spec:
      containers:
        - name: feature-store
          image: onerec-feature-store:latest   # build from platform/feature_store/Dockerfile
          ports: [{containerPort: 9100, name: http}]
          env:
            - {name: FEATURE_STORE_BACKEND, value: redis}
            - {name: REDIS_URL, value: "redis://onerec-redis.onerec.svc.cluster.local:6379/0"}
          resources:
            requests: {cpu: "250m", memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /health, port: 9100}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 9100}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: onerec-feature-store, namespace: onerec}
spec:
  selector: {app: onerec-feature-store}
  ports: [{name: http, port: 9100, targetPort: 9100}]
