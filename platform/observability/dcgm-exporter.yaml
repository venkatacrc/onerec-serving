# NVIDIA DCGM-exporter: per-GPU utilization, power, memory, ECC error, and
# throttle-reason metrics -- the signal KEDA's second trigger
# (platform/k8s/30-keda-scaledobjects.yaml) and the "GPU ECC errors /
# OOM/preemption" alert rules (prometheus-rules.yaml) both depend on.
# One pod per node (DaemonSet) since it reads the node's local GPUs
# directly via NVML/DCGM.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: onerec-observability
  labels: {app: dcgm-exporter}
spec:
  selector: {matchLabels: {app: dcgm-exporter}}
  template:
    metadata:
      labels: {app: dcgm-exporter}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.1-ubuntu22.04
          ports: [{name: metrics, containerPort: 9400}]
          securityContext:
            capabilities: {add: ["SYS_ADMIN"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: nvidia-install-dir-host, mountPath: /usr/local/nvidia}
      volumes:
        - name: nvidia-install-dir-host
          hostPath: {path: /usr/local/nvidia}
---
apiVersion: v1
kind: Service
metadata:
  name: dcgm-exporter
  namespace: onerec-observability
spec:
  selector: {app: dcgm-exporter}
  ports: [{name: metrics, port: 9400, targetPort: 9400}]
