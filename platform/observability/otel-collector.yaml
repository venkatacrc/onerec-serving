# OpenTelemetry Collector: receives OTLP spans from the router
# (OTEL_EXPORTER_OTLP_ENDPOINT env var on the router Deployment) and
# forwards them to Jaeger. Kept as a separate hop (rather than the router
# exporting straight to Jaeger) so processors/additional exporters (e.g. a
# SaaS APM backend later) are a config change here, not a router code change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: onerec-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
          http: {endpoint: "0.0.0.0:4318"}
    processors:
      batch: {}
    exporters:
      otlp:
        endpoint: "jaeger-collector.onerec-observability.svc.cluster.local:4317"
        tls: {insecure: true}
      logging:
        loglevel: warn
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, logging]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: onerec-observability
  labels: {app: otel-collector}
spec:
  replicas: 1
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.105.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: config, mountPath: /etc/otel}]
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: onerec-observability
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
    - {name: otlp-http, port: 4318, targetPort: 4318}
